name: Deploy initiative tracker

# Runs only when the tracker (or something it is built from) changes, and
# replaces only the initiative/ folder on the gh-pages branch.
on:
  push:
    branches: [main]
    paths:
      - extensions/initiative_tracker/**
      - package.json
      - package-lock.json
      - .github/scripts/publish.sh
      - .github/workflows/deploy-initiative.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-initiative
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Project sites are served from /<repo>/, and the tracker has its own folder.
      BASE_PATH: /${{ github.event.repository.name }}/initiative/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w initiative_tracker
      - run: npm test -w initiative_tracker
      - run: npm run build -w initiative_tracker
      - run: bash .github/scripts/publish.sh extensions/initiative_tracker/dist initiative
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
